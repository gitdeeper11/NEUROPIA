[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuropia-engine"
version = "1.0.0"
description = "NEUROPIA: Neural Singularity and Unified Field Synthesis Framework"
authors = [
  {name = "Samir Baladi", email = "gitdeeper@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
"Homepage" = "https://neuropia-v1.netlify.app"
"Dashboard" = "https://neuropia-v1.netlify.app/dashboard"
"Documentation" = "https://neuropia-v1.netlify.app/documentation"
"Repository" = "https://gitlab.com/gitdeeper11/NEUROPIA"
"GitHub" = "https://github.com/gitdeeper11/NEUROPIA"
"DOI" = "https://doi.org/10.5281/zenodo.20092199"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuropia*"]
